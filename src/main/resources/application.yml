spring:
  application:
    name: goalhub
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goalhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Default pool size for local dev and production.
      # Override via HIKARI_MAX_POOL_SIZE env var for prod tuning.
      # NOTE: Benchmark tests (MySQLContainerBase) explicitly set pool=50
      #       to maximize concurrency pressure for measurement purposes.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7d3d7f4c3be5ba3a5e8e6a3d1f}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  order:
    hold-duration-minutes: ${ORDER_HOLD_DURATION_MINUTES:10}
    cleanup-interval-ms: ${ORDER_CLEANUP_INTERVAL_MS:30000}

logging:
  level:
    com.goalhub: DEBUG
    org.springframework.security: INFO
